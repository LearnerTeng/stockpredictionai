services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockpredictionai
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp_local
    ports:
      - "5432:5432"
    volumes:
      - stockpredictionai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockpredictionai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockpredictionai_pgdata:
